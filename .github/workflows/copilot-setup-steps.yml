name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      OCAML_VERSION: 5.3.0
      OPAMYES: 1
      MINGW_ARCH: x86_64
      CYG_ROOT: C:\cygwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          set -ex
          sudo apt-get update -qqy
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Use-Pty=0 install -y \
            opam libpcre2-dev zlib1g-dev libgtk2.0-dev libmbedtls-dev ninja-build \
            cmake gcc-multilib g++-multilib \
            libturbojpeg-dev libvorbis-dev \
            libuv1-dev libreadline-dev

      - name: Cache opam
        if: runner.os == 'Linux'
        id: cache-opam
        uses: actions/cache@v4
        with:
          path: ~/.opam/
          key: ${{ runner.os }}-${{ runner.arch }}-5.3.0-${{ hashFiles('./haxe.opam', './libs/') }}-1

      - name: Initialize opam and install OCaml 5.3.0
        if: runner.os == 'Linux' && steps.cache-opam.outputs.cache-hit != 'true'
        run: |
          set -ex
          opam init -c 5.3.0 --no-setup
          opam pin add haxe . --no-action
          opam install haxe --deps-only --assume-depexts
          opam list
          ocamlopt -v

      - name: Persist opam environment for subsequent steps
        if: runner.os == 'Linux'
        run: |
          set -ex
          eval $(opam env)
          echo "$OPAM_SWITCH_PREFIX/bin" >> $GITHUB_PATH
          echo "OPAM_SWITCH_PREFIX=$OPAM_SWITCH_PREFIX" >> $GITHUB_ENV
          echo "CAML_LD_LIBRARY_PATH=$CAML_LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "OCAML_TOPLEVEL_PATH=$OCAML_TOPLEVEL_PATH" >> $GITHUB_ENV

      - name: Setup OCaml (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-ocaml-windows

      - name: Setup Neko
        uses: ./.github/actions/setup-neko
        env:
          PLATFORM: ${{ runner.os == 'Linux' && 'linux64' || 'windows64' }}

      - name: Make Neko shared libraries available to the dynamic linker
        if: runner.os == 'Linux'
        run: |
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/local.conf
          sudo ldconfig

      - name: Build Haxe (Linux)
        if: runner.os == 'Linux'
        run: |
          set -ex
          eval $(opam env)
          opam config exec -- make -s -j`nproc` STATICLINK=1 haxe
          opam config exec -- make -s haxelib
          make -s package_unix
          ls -l out
          ldd -v ./haxe
          ldd -v ./haxelib

      - name: Build Haxe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-PSDebug -Trace 1
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          opam exec -- make -s -f Makefile.win -j"$env:NUMBER_OF_PROCESSORS" haxe
          opam exec -- make -s -f Makefile.win haxelib

      - name: Add workspace to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE" >> $GITHUB_PATH

      - name: Setup haxelib
        shell: bash
        run: |
          set -ex
          mkdir ~/haxelib
          haxelib setup ~/haxelib
          haxelib git utest https://github.com/haxe-utest/utest.git
          haxelib git hxcoro https://github.com/HaxeFoundation/hxcoro.git
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp.git
          haxelib git hxjava https://github.com/HaxeFoundation/hxjava.git
          haxelib git haxeserver https://github.com/Simn/haxeserver.git